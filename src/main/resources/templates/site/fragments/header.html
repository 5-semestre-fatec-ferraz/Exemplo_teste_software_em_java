<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Fragmento do HEAD (importação de CSS e meta tags) -->
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWJ Barbearia - Sistema de Autenticação</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- Fragmento do HEADER (Cabeçalho da Página) -->
    <header class="modern-header" th:fragment="header">
        <div class="header-container alignwide" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
            <div class="header-logo">
                <a th:href="@{/}" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: bold; font-size: 1.3rem; color: #333;">
                    <span>GWJ Barbearia</span>
                </a>
            </div>

            <nav class="header-nav" id="headerNav">
                <ul style="display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; align-items: center;">
                    <li><a th:href="@{/}" style="text-decoration: none; color: #444;">Home</a></li>
                    
                    <!-- Usuário Logado -->
                    <li th:if="${session.usuarioLogado != null}" class="header-user-menu" style="display: flex; align-items: center; gap: 1rem;">
                        <span class="header-welcome-text">Olá, <strong th:text="${session.usuarioLogado.nomeUsuario}">Usuário</strong></span>
                        <a th:href="@{/logout}" class="header-link-danger" data-testid="button-logout" style="color: #dc3545; font-weight: bold; text-decoration: none;">Sair</a>
                    </li>

                    <!-- Visitante -->
                    <li th:if="${session.usuarioLogado == null}">
                        <a th:href="@{/login}" class="header-link" style="text-decoration: none; color: #0d6efd; font-weight: 500;">Entrar</a>
                    </li>
                    <li th:if="${session.usuarioLogado == null}">
                        <a th:href="@{/cadastro}" class="header-link-primary" style="text-decoration: none; background: #0d6efd; color: white; padding: 0.4rem 0.8rem; border-radius: 4px;">Cadastrar</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
</body>
</html>
